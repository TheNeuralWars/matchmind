name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python-version }}" }
      - name: Unit tests (stdlib only, no deps)
        run: python -m unittest -v
      - name: MCP smoke test
        run: printf '{"jsonrpc":"2.0","id":1,"method":"tools/list"}\n' | python -m matchmind.mcp_server | grep -q get_key_moments
